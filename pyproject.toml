[project]
name = "attitude-gnc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
attitude-gnc = "attitude_gnc:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88  # standard line length (same as black)

[tool.ruff.lint]
select = [
    "E", "W",  # basic style (PEP 8)
    "F",       # logic errors: unused variables, undefined names
    "I",       # import sorting
    "N",       # naming conventions
    "UP",      # modern syntax for the project's Python version
    "B",       # common pitfalls (mutable default arguments, etc.)
    "NPY",     # NumPy-specific rules
]
ignore = [
    "N803",  # uppercase argument names: keep Kalman notation (P, K, F, H, Q, R)
    "N806",  # uppercase local variables: same reason
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
